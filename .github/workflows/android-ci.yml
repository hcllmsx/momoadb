name: Android 正式版发布

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "正式版本标签，例如 v1.0.0；留空则按 VERSION 推导。"
        required: false
        default: ""

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: 构建并发布正式版
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: 拉取代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 配置 JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4

      - name: 安装 Android SDK 组件
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: 授予 Wrapper 执行权限
        run: chmod +x gradlew

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: 解码发布签名密钥
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${SIGNING_KEY_BASE64}" || -z "${KEY_ALIAS}" || -z "${KEY_STORE_PASSWORD}" || -z "${KEY_PASSWORD}" ]]; then
            echo "缺少发布签名密钥，请配置 SIGNING_KEY_BASE64、KEY_ALIAS、KEY_STORE_PASSWORD、KEY_PASSWORD。" >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/signing"
          echo "${SIGNING_KEY_BASE64}" | base64 --decode > "${RUNNER_TEMP}/signing/release.p12"

      - name: 运行单元测试
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: 运行 Android Lint
        run: ./gradlew --no-daemon lintRelease

      - name: 解析并校验发布版本
        id: version
        env:
          TAG_INPUT: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          RELEASE_TAG="$(echo "${TAG_INPUT:-}" | xargs)"
          if [[ -z "${RELEASE_TAG}" && "${REF_TYPE}" == "tag" ]]; then
            RELEASE_TAG="${REF_NAME}"
          fi
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ -z "${RELEASE_TAG}" ]]; then
            RELEASE_TAG="v${FILE_VERSION}"
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "正式版本标签必须形如 v主.次.修订，例如 v26.11.16。" >&2
            exit 1
          fi
          VERSION_NO_V="${RELEASE_TAG#v}"
          if [[ "${VERSION_NO_V}" != "${FILE_VERSION}" ]]; then
            echo "版本标签 ${RELEASE_TAG} 与 VERSION 文件 ${FILE_VERSION} 不一致，请先同步后再发布。" >&2
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION_NO_V}"
          VERSION_CODE=$(((MAJOR * 10000 + MINOR * 100 + PATCH) * 10 + 9))
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION_NO_V}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "发布版本：${RELEASE_TAG}（versionCode ${VERSION_CODE}）"

      - name: 构建 Release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          SIGNING_STORE_FILE: ${{ runner.temp }}/signing/release.p12
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: 发布正式版 APK 到 GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION_NO_V: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          LITE_APK_PATH="$(find lite/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [[ -z "${APK_PATH}" || -z "${LITE_APK_PATH}" ]]; then
            echo "未找到构建产物：APK_PATH=${APK_PATH} LITE_APK_PATH=${LITE_APK_PATH}" >&2
            exit 1
          fi
          # 上传前统一命名，下载者一眼能分清标准版与轻量版；文件名保留 v 前缀。
          cp "${APK_PATH}" "momoadb-${RELEASE_TAG}.apk"
          cp "${LITE_APK_PATH}" "momoadb-lite-${RELEASE_TAG}.apk"
          APK_PATH="momoadb-${RELEASE_TAG}.apk"
          LITE_APK_PATH="momoadb-lite-${RELEASE_TAG}.apk"
          RELEASE_TITLE="默默ADB ${RELEASE_TAG}"

          # Release 正文优先取 CHANGELOG.md 中本次版本的小节，保证说明与版本一一对应。
          CHANGELOG_TEXT="$(awk -v heading="## v${VERSION_NO_V}" '
            $0 == heading { capture = 1; next }
            capture && /^## / { capture = 0; exit }
            capture { lines[++total] = $0 }
            END {
              start = 1; end = total
              while (start <= end && lines[start] ~ /^[[:space:]]*$/) start++
              while (end >= start && lines[end] ~ /^[[:space:]]*$/) end--
              for (i = start; i <= end; i++) print lines[i]
            }
          ' CHANGELOG.md || true)"

          if [[ -z "${CHANGELOG_TEXT}" ]]; then
            CURRENT_TAG="${RELEASE_TAG}"
            PREVIOUS_TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${CURRENT_TAG}$" | head -n 1 || true)"
            if [[ -n "${PREVIOUS_TAG}" ]]; then
              RANGE="${PREVIOUS_TAG}..HEAD"
            else
              # 首次发布没有上一个标签：只取本次提交，避免把继承来的全部历史都写进说明。
              RANGE="HEAD~1..HEAD"
            fi
            CHANGELOG_TEXT="$(git log "${RANGE}" --no-merges --pretty=format:'%s%x09%h' | awk -F '\t' '!seen[$1]++ { printf "- %s (%s)\n", $1, $2 }' || true)"
          fi

          if [[ -z "${CHANGELOG_TEXT}" ]]; then
            CHANGELOG_TEXT="- 本次正式版未检测到新的更新记录。"
          fi

          RELEASE_NOTES="$(mktemp)"
          {
            echo "### 更新内容"
            echo
            echo "${CHANGELOG_TEXT}"
          } > "${RELEASE_NOTES}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_TITLE}" \
              --notes-file "${RELEASE_NOTES}"
            gh release upload "${RELEASE_TAG}" "${APK_PATH}" "${LITE_APK_PATH}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${APK_PATH}" "${LITE_APK_PATH}" \
              --title "${RELEASE_TITLE}" \
              --notes-file "${RELEASE_NOTES}"
          fi